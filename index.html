<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>monday.com API Viewer</title>

    <style>
      :root{
        --bg: #0b1220;
        --card: rgba(255,255,255,0.06);
        --card2: rgba(255,255,255,0.10);
        --text: #e8ecff;
        --muted: rgba(232,236,255,0.75);
        --brand: #7c3aed;
        --danger:#ff4d6d;
        --border: rgba(255,255,255,0.12);
      }

      * { box-sizing: border-box; }

      body{
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        color: var(--text);
        background:
          radial-gradient(900px 500px at 15% 10%, rgba(124,58,237,0.35), transparent 60%),
          radial-gradient(900px 500px at 85% 20%, rgba(59,130,246,0.30), transparent 60%),
          var(--bg);
        min-height: 100vh;
      }

      .wrap{
        max-width: 980px;
        margin: 0 auto;
        padding: 28px 16px 60px;
      }

      h1{
        margin: 0 0 10px;
        font-size: 34px;
      }

      p{
        margin: 0 0 14px;
        color: var(--muted);
      }

      button{
        border: 0;
        color: #fff;
        font-weight: 700;
        padding: 10px 16px;
        border-radius: 14px;
        cursor: pointer;
        background: linear-gradient(135deg, var(--brand), #3b82f6);
        box-shadow: 0 10px 24px rgba(124,58,237,0.30);
      }

      .card{
        margin-top: 18px;
        background: linear-gradient(180deg, var(--card2), var(--card));
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 16px;
        box-shadow: 0 18px 50px rgba(0,0,0,0.35);
      }

      .status{
        margin-top: 10px;
        color: var(--muted);
      }

      .error{
        margin-top: 10px;
        color: var(--danger);
        font-weight: 700;
      }

      ul{
        margin: 10px 0 0;
        padding-left: 18px;
      }

      li{
        margin: 8px 0;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.05);
      }

      pre{
        margin-top: 10px;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(0,0,0,0.35);
        overflow: auto;
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <h1>monday.com API Viewer</h1>
      <p>Data is fetched through your serverless backend (<code>/api/monday</code>).</p>

      <div class="card">
        <button id="load">Load Boards</button>
        <p id="status" class="status"></p>
        <p id="error" class="error"></p>
      </div>

      <div class="card">
        <h2>Boards</h2>
        <ul id="boardsList"></ul>
      </div>

      <div class="card">
        <h2>Boards (raw JSON)</h2>
        <pre id="out">{}</pre>
      </div>
    </div>

    <script>
      const loadBtn = document.getElementById("load");
      const statusEl = document.getElementById("status");
      const errorEl = document.getElementById("error");
      const outEl = document.getElementById("out");
      const boardsListEl = document.getElementById("boardsList");

      async function callMonday(query, variables) {
        const res = await fetch("/api/monday", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query, variables })
        });

        const text = await res.text();
        let json;
        try { json = JSON.parse(text); }
        catch { throw new Error("Not JSON:\n" + text); }

        if (!res.ok) throw new Error(JSON.stringify(json));
        return json;
      }

      loadBtn.addEventListener("click", async () => {
        errorEl.textContent = "";
        statusEl.textContent = "Loading boards...";
        outEl.textContent = "{}";
        boardsListEl.innerHTML = "";

        try {
          const query = `
            query {
              boards(limit: 20) { id name }
            }
          `;

          const data = await callMonday(query);

          outEl.textContent = JSON.stringify(data, null, 2);

          const boards = data?.data?.boards || [];
          boardsListEl.innerHTML = boards
            .map(b => `<li><b>${escapeHtml(b.name)}</b> <span style="color:#aaa;">(id: ${b.id})</span></li>`)
            .join("");

          statusEl.textContent = "Done ✅";
        } catch (e) {
          statusEl.textContent = "";
          errorEl.textContent = e.message;
        }
      });

      function escapeHtml(str) {
        return String(str)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }
    </script>
  </body>
</html>
