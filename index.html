<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>monday API Viewer</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 900px; margin: 24px auto; padding: 0 16px; }
      button { padding: 10px 14px; cursor: pointer; }
      pre { background: #f6f6f6; padding: 12px; border-radius: 8px; overflow: auto; }
      .error { color: #b00020; }
    </style>
  </head>

  <body>
    <h1>monday API Viewer</h1>
    <p>This loads your first 20 boards via your backend: <code>/api/monday</code></p>

    <button id="load">Load Boards</button>
    <p id="status"></p>
    <p id="error" class="error"></p>

    <h2>Boards (raw JSON)</h2>
    <pre id="out">{}</pre>

    <script>
      const loadBtn = document.getElementById("load");
      const statusEl = document.getElementById("status");
      const errorEl = document.getElementById("error");
      const outEl = document.getElementById("out");

      async function callMonday(query, variables) {
        const res = await fetch("/api/monday", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query, variables })
        });

        const text = await res.text();
        let json;
        try { json = JSON.parse(text); }
        catch { throw new Error("Not JSON:\n" + text); }

        if (!res.ok) throw new Error(JSON.stringify(json));
        return json;
      }

      loadBtn.addEventListener("click", async () => {
        errorEl.textContent = "";
        statusEl.textContent = "Loading boards...";
        outEl.textContent = "{}";

        try {
          const query = `
            query {
              boards(limit: 20) { id name }
            }
          `;

          const data = await callMonday(query);
          outEl.textContent = JSON.stringify(data, null, 2);
          statusEl.textContent = "Done ✅";
        } catch (e) {
          statusEl.textContent = "";
          errorEl.textContent = e.message;
        }
      });
    </script>
  </body>
</html>
