<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>monday.com API Viewer</title>

    <style>
      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background:
          radial-gradient(900px 500px at 15% 10%, rgba(124,58,237,0.35), transparent 60%),
          radial-gradient(900px 500px at 85% 20%, rgba(59,130,246,0.30), transparent 60%),
          radial-gradient(900px 500px at 55% 95%, rgba(34,197,94,0.18), transparent 60%),
          #0b1220;
        color: #e8ecff;
        min-height: 100vh;
      }

      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 28px 16px 60px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 34px;
        letter-spacing: -0.4px;
      }

      h2 { margin-top: 0; }

      p {
        margin: 0 0 14px;
        color: rgba(232,236,255,0.75);
      }

      code {
        background: rgba(255,255,255,0.12);
        padding: 2px 6px;
        border-radius: 6px;
        color: #fff;
      }

      .card {
        margin-top: 18px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 18px;
        padding: 16px;
        box-shadow: 0 18px 50px rgba(0,0,0,0.35);
        backdrop-filter: blur(8px);
      }

      button {
        border: 0;
        color: #fff;
        font-weight: 700;
        padding: 10px 16px;
        border-radius: 14px;
        cursor: pointer;
        background: linear-gradient(135deg, #7c3aed, #3b82f6);
        box-shadow: 0 10px 24px rgba(124,58,237,0.30);
      }

      button:hover { filter: brightness(1.05); }
      button:disabled { opacity: 0.55; cursor: not-allowed; }

      select {
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(0,0,0,0.35);
        color: #e8ecff;
        border: 1px solid rgba(255,255,255,0.15);
      }

      .status {
        margin-top: 10px;
        color: rgba(232,236,255,0.75);
      }

      .error {
        margin-top: 10px;
        color: #ff4d6d;
        font-weight: 700;
        white-space: pre-wrap;
      }

      ul {
        margin: 12px 0 0;
        padding-left: 18px;
      }

      li {
        margin: 8px 0;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.15);
        background: rgba(255,255,255,0.05);
      }

      pre {
        margin-top: 10px;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.15);
        background: rgba(0,0,0,0.35);
        overflow: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
      }

      th, td {
        padding: 10px;
        border-bottom: 1px solid rgba(255,255,255,0.12);
        text-align: left;
        vertical-align: top;
      }

      th {
        border-bottom: 1px solid rgba(255,255,255,0.18);
        color: rgba(232,236,255,0.9);
      }

      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

      .load-items {
        background: linear-gradient(135deg, #22c55e, #3b82f6);
        box-shadow: 0 10px 24px rgba(34,197,94,0.22);
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <h1>monday.com API Viewer</h1>
      <p>Data is fetched via your serverless backend (<code>/api/monday</code>).</p>

      <div class="card">
        <div class="row">
          <button id="load">Load Boards</button>

          <label for="boardsSelect" style="color:rgba(232,236,255,0.75); font-weight:700;">Select board:</label>
          <select id="boardsSelect" disabled>
            <option value="">(load boards first)</option>
          </select>

          <button id="loadItems" class="load-items" disabled>Load Items</button>
        </div>

        <p id="status" class="status"></p>
        <p id="error" class="error"></p>
      </div>

      <div class="card">
        <h2>Boards</h2>
        <ul id="boardsList"></ul>
      </div>

      <div class="card">
        <h2>Items</h2>
        <div id="itemsContainer" style="color:rgba(232,236,255,0.75);">No items loaded yet.</div>
      </div>

      <div class="card">
        <h2>Raw JSON (last response)</h2>
        <pre id="out">{}</pre>
      </div>
    </div>

    <script>
      const loadBtn = document.getElementById("load");
      const loadItemsBtn = document.getElementById("loadItems");
      const boardsSelectEl = document.getElementById("boardsSelect");

      const statusEl = document.getElementById("status");
      const errorEl = document.getElementById("error");
      const outEl = document.getElementById("out");

      const boardsListEl = document.getElementById("boardsList");
      const itemsContainerEl = document.getElementById("itemsContainer");

      async function callMonday(query, variables) {
        const res = await fetch("/api/monday", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query, variables })
        });

        const text = await res.text();
        let json;
        try { json = JSON.parse(text); }
        catch { throw new Error("Backend did not return JSON:\n" + text); }

        if (!res.ok) throw new Error(JSON.stringify(json, null, 2));
        return json;
      }

      loadBtn.addEventListener("click", async () => {
        errorEl.textContent = "";
        statusEl.textContent = "Loading boards...";
        outEl.textContent = "{}";
        boardsListEl.innerHTML = "";
        boardsSelectEl.innerHTML = `<option value="">(loading...)</option>`;
        boardsSelectEl.disabled = true;
        loadItemsBtn.disabled = true;
        itemsContainerEl.textContent = "No items loaded yet.";

        try {
          const query = `
            query {
              boards(limit: 20) { id name }
            }
          `;

          const data = await callMonday(query);
          outEl.textContent = JSON.stringify(data, null, 2);

          const boards = data?.data?.boards || [];

          boardsListEl.innerHTML = boards
            .map(b => `<li><b>${escapeHtml(b.name)}</b> <span style="color:#aaa;">(id: ${b.id})</span></li>`)
            .join("");

          boardsSelectEl.innerHTML =
            `<option value="">(select a board)</option>` +
            boards.map(b => `<option value="${b.id}">${escapeHtml(b.name)} (${b.id})</option>`).join("");

          boardsSelectEl.disabled = false;
          loadItemsBtn.disabled = false;

          statusEl.textContent = `Loaded ${boards.length} board(s).`;
        } catch (e) {
          statusEl.textContent = "";
          errorEl.textContent = e.message;
          boardsSelectEl.innerHTML = `<option value="">(load boards first)</option>`;
          boardsSelectEl.disabled = true;
          loadItemsBtn.disabled = true;
        }
      });

      loadItemsBtn.addEventListener("click", async () => {
        errorEl.textContent = "";

        const boardId = boardsSelectEl.value;
        if (!boardId) {
          errorEl.textContent = "Pick a board first.";
          return;
        }

        statusEl.textContent = `Loading items from board ${boardId}...`;
        itemsContainerEl.textContent = "Loading...";

        try {
          const query = `
            query ($boardId: [ID!]) {
              boards(ids: $boardId) {
                items_page(limit: 20) {
                  items { id name }
                }
              }
            }
          `;

          const variables = { boardId: Number(boardId) };
          const data = await callMonday(query, variables);
          outEl.textContent = JSON.stringify(data, null, 2);

          const items = data?.data?.boards?.[0]?.items_page?.items || [];

          if (items.length === 0) {
            itemsContainerEl.textContent = "No items found.";
            statusEl.textContent = "Done ✅";
            return;
          }

          const rows = items.map(item => `
            <tr>
              <td style="width:140px;">${item.id}</td>
              <td>${escapeHtml(item.name)}</td>
            </tr>
          `).join("");

          itemsContainerEl.innerHTML = `
            <table>
              <thead>
                <tr>
                  <th style="width:140px;">Item ID</th>
                  <th>Name</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          `;

          statusEl.textContent = `Loaded ${items.length} item(s). ✅`;
        } catch (e) {
          statusEl.textContent = "";
          itemsContainerEl.textContent = "No items loaded yet.";
          errorEl.textContent = e.message;
        }
      });

      function escapeHtml(str) {
        return String(str)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }
    </script>
  </body>
</html>
