<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>monday.com API Viewer</title>

    <style>
      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background:
          radial-gradient(900px 500px at 15% 10%, rgba(124,58,237,0.35), transparent 60%),
          radial-gradient(900px 500px at 85% 20%, rgba(59,130,246,0.30), transparent 60%),
          radial-gradient(900px 500px at 55% 95%, rgba(34,197,94,0.18), transparent 60%),
          #0b1220;
        color: #e8ecff;
        min-height: 100vh;
      }

      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 28px 16px 60px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 34px;
        letter-spacing: -0.4px;
      }

      h2 {
        margin-top: 0;
      }

      p {
        margin: 0 0 14px;
        color: rgba(232,236,255,0.75);
      }

      button {
        border: 0;
        color: #fff;
        font-weight: 700;
        padding: 10px 16px;
        border-radius: 14px;
        cursor: pointer;
        background: linear-gradient(135deg, #7c3aed, #3b82f6);
        box-shadow: 0 10px 24px rgba(124,58,237,0.30);
      }

      button:hover { filter: brightness(1.05); }

      .card {
        margin-top: 18px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 18px;
        padding: 16px;
        box-shadow: 0 18px 50px rgba(0,0,0,0.35);
        backdrop-filter: blur(8px);
      }

      .status {
        margin-top: 10px;
        color: rgba(232,236,255,0.75);
      }

      .error {
        margin-top: 10px;
        color: #ff4d6d;
        font-weight: 700;
      }

      ul {
        margin: 10px 0 0;
        padding-left: 18px;
      }

      li {
        margin: 8px 0;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.15);
        background: rgba(255,255,255,0.05);
      }

      pre {
        margin-top: 10px;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.15);
        background: rgba(0,0,0,0.35);
        overflow: auto;
      }

      code {
        background: rgba(255,255,255,0.12);
        padding: 2px 6px;
        border-radius: 6px;
        color: #fff;
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <h1>monday.com API Viewer</h1>
      <p>Data is fetched via your serverless backend (<code>/api/monday</code>).</p>

      <div class="card">
  <h2>Boards</h2>

  <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
    <label for="boardsSelect" style="color:rgba(232,236,255,0.75); font-weight:700;">Select board:</label>
    <select id="boardsSelect" disabled
      style="padding:10px 12px; border-radius:12px; background:rgba(0,0,0,0.35); color:#e8ecff; border:1px solid rgba(255,255,255,0.15);">
      <option value="">(load boards first)</option>
    </select>
  </div>

  <ul id="boardsList" style="margin-top:12px;"></ul>
</div>

      <div class="card">
        <h2>Boards</h2>
        <ul id="boardsList"></ul>
      </div>

      <div class="card">
        <h2>Boards (raw JSON)</h2>
        <pre id="out">{}</pre>
      </div>
    </div>

    <script>
      const loadBtn = document.getElementById("load");
      const statusEl = document.getElementById("status");
      const errorEl = document.getElementById("error");
      const outEl = document.getElementById("out");
      const boardsListEl = document.getElementById("boardsList");
      const boardsSelectEl = document.getElementById("boardsSelect");

      async function callMonday(query, variables) {
        const res = await fetch("/api/monday", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query, variables })
        });

        const text = await res.text();
        let json;
        try { json = JSON.parse(text); }
        catch { throw new Error("Not JSON:\n" + text); }

        if (!res.ok) throw new Error(JSON.stringify(json));
        return json;
      }

      loadBtn.addEventListener("click", async () => {
        errorEl.textContent = "";
        statusEl.textContent = "Loading boards...";
        outEl.textContent = "{}";
        boardsListEl.innerHTML = "";

        try {
          const query = `
            query {
              boards(limit: 20) { id name }
            }
          `;

          const data = await callMonday(query);

          outEl.textContent = JSON.stringify(data, null, 2);

          const boards = data?.data?.boards || [];
          boardsSelectEl.innerHTML =
  `<option value="">(select a board)</option>` +
  boards.map(b => `<option value="${b.id}">${escapeHtml(b.name)} (${b.id})</option>`).join("");

boardsSelectEl.disabled = false;

          boardsListEl.innerHTML = boards
            .map(b =>
              `<li><b>${escapeHtml(b.name)}</b>
              <span style="color:#aaa;">(id: ${b.id})</span></li>`
            )
            .join("");

          statusEl.textContent = "Done ✅";
        } catch (e) {
          statusEl.textContent = "";
          errorEl.textContent = e.message;
        }
      });

      function escapeHtml(str) {
        return String(str)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }
    </script>
  </body>
</html>
