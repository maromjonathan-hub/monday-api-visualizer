<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>monday API Visualizer</title>
    <style>
      body { font-family: Arial, sans-serif; max-width: 900px; margin: 24px auto; padding: 0 16px; }
      textarea { width: 100%; height: 180px; font-family: monospace; font-size: 14px; }
      pre { background: #f5f5f5; padding: 12px; overflow: auto; }
      button { padding: 10px 14px; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>monday.com API Visualizer</h1>

    <p>Paste a GraphQL query below and click Run.</p>

    <textarea id="query">
query {
  me {
    id
    name
    email
  }
}
    </textarea>
    <br /><br />
    <button id="run">Run</button>

    <h2>Result</h2>
    <pre id="out">{}</pre>

    <script>
      const runBtn = document.getElementById("run");
      const queryEl = document.getElementById("query");
      const outEl = document.getElementById("out");

      runBtn.addEventListener("click", async () => {
        outEl.textContent = "Loading...";
        try {
          const res = await fetch("/api/monday", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: queryEl.value })
          });

          const text = await res.text();
          // Try to pretty print JSON; fall back to raw text
          try {
            outEl.textContent = JSON.stringify(JSON.parse(text), null, 2);
          } catch {
            outEl.textContent = text;
          }
        } catch (err) {
          outEl.textContent = String(err);
        }
      });
    </script>
  </body>
</html>
